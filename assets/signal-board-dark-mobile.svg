    <text x="42" y="500" fill="#f4f7fb" font-size="25" font-weight="720">Knowledge → action</text>
    <text x="42" y="529" fill="#9eabc0" font-size="16">retrieval · tools · safety</text>
    <rect x="42" y="559" width="98" height="32" rx="16" fill="#172a40"/>
    <text x="61" y="580" fill="#89b8e5" font-size="13" font-weight="700">HYBRID RAG</text>
    <text x="164" y="580" fill="#77869e" font-size="13" font-weight="650">multi-format</text>
    <rect x="404" y="475" width="38" height="47" rx="7" fill="#172a40" stroke="#355373"/>
    <rect x="404" y="541" width="38" height="47" rx="7" fill="#172a40" stroke="#355373"/>
    <circle cx="468" cy="531" r="24" fill="#497eb6"/>
    <path d="M458 531l7 7 14-17" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M442 499h13c8 0 13 7 13 15M442 564h13c8 0 13-7 13-15" fill="none" stroke="#5d7896" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Algorithms -->
    <rect x="14" y="638" width="492" height="194" rx="22" fill="#111b2d" stroke="#27344a"/>
    <rect x="14" y="638" width="5" height="194" rx="3" fill="#f6c177"/>
    <text x="42" y="671" fill="#f6c177" font-size="13" font-weight="750" letter-spacing="2">ALGORITHMIC CORE · ICPC / CCPC</text>
    <text x="42" y="708" fill="#f4f7fb" font-size="25" font-weight="720">Think fast. Prove it.</text>
    <text x="42" y="737" fill="#9eabc0" font-size="16">modeling · correctness · performance</text>
    <rect x="42" y="767" width="96" height="32" rx="16" fill="#342818"/>
    <text x="65" y="788" fill="#f6c177" font-size="13" font-weight="750">2× GOLD</text>
    <rect x="148" y="767" width="104" height="32" rx="16" fill="#242e3e"/>
    <text x="170" y="788" fill="#aeb8c8" font-size="13" font-weight="750">3× SILVER</text>
    <path d="M433 675h46v20c0 31-23 52-46 59-23-7-46-28-46-59v-20h46z" fill="#312719" stroke="#c8954d" stroke-width="2"/>
    <path d="M412 675v-11h42v11M416 711l10 10 20-24" fill="none" stroke="#f6c177" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="433" cy="778" r="17" fill="#c58b3d"/>
    <text x="428" y="784" fill="#fff" font-size="18" font-weight="800">1</text>

    <!-- Next -->
    <rect x="14" y="846" width="492" height="80" rx="20" fill="url(#next)" stroke="#314057"/>
    <text x="42" y="875" fill="#8090a8" font-size="11" font-weight="750" letter-spacing="2">NEXT VECTOR</text>
    <text x="42" y="903" fill="#e3eaf5" font-size="15" font-weight="670">Embodied navigation</text>
    <circle cx="210" cy="898" r="4" fill="#6ed7e8"/>
    <text x="226" y="903" fill="#e3eaf5" font-size="15" font-weight="670">RL</text>
    <circle cx="264" cy="898" r="4" fill="#a994ff"/>
    <text x="280" y="903" fill="#e3eaf5" font-size="15" font-weight="670">Problem generation</text>

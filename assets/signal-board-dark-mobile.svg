<svg xmlns="http://www.w3.org/2000/svg" width="520" height="940" viewBox="0 0 520 940" role="img" aria-labelledby="title desc">
  <title id="title">Weiyi Li — research and engineering signal board</title>
  <desc id="desc">Mobile visual summary of cross-view research, efficient LLM inference, agent systems, competitive programming, and future work in embodied navigation and reinforcement learning.</desc>
  <defs>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a32"/>
      <stop offset="0.52" stop-color="#25213e"/>
      <stop offset="1" stop-color="#332818"/>
    </linearGradient>
    <pattern id="microgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#b6c4d8" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="520" height="940" rx="26" fill="#0b1220"/>
  <rect width="520" height="940" rx="26" fill="url(#microgrid)"/>

  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- Research -->
    <rect x="14" y="14" width="492" height="194" rx="22" fill="#111b2d" stroke="#27344a"/>
    <rect x="14" y="14" width="5" height="194" rx="3" fill="#6ed7e8"/>
    <text x="42" y="47" fill="#6ed7e8" font-size="13" font-weight="750" letter-spacing="2">RESEARCH · LUCL</text>
    <text x="42" y="84" fill="#f4f7fb" font-size="25" font-weight="720">Cross-view learning</text>
    <text x="42" y="113" fill="#9eabc0" font-size="16">uncertainty · contrastive · multimodal</text>
    <rect x="42" y="143" width="136" height="32" rx="16" fill="#14323b"/>
    <text x="60" y="164" fill="#78d5df" font-size="13" font-weight="700">3× FIRST AUTHOR</text>
    <text x="192" y="164" fill="#77869e" font-size="13" font-weight="650">TIP · AAAI · AAS</text>
    <rect x="410" y="53" width="58" height="48" rx="9" fill="#142635" stroke="#315464"/>
    <circle cx="435" cy="76" r="5" fill="#6ed7e8"/>
    <rect x="430" y="119" width="58" height="48" rx="9" fill="#221e39" stroke="#534b7a"/>
    <path d="M438 133h42M438 143h28M438 153h36" stroke="#aa98ec" stroke-width="2" stroke-linecap="round"/>
    <path d="M437 101c3 9 9 13 17 18" fill="none" stroke="#a994ff" stroke-width="2.5" stroke-dasharray="4 5"/>

    <!-- Inference -->
    <rect x="14" y="222" width="492" height="194" rx="22" fill="#111b2d" stroke="#27344a"/>
    <rect x="14" y="222" width="5" height="194" rx="3" fill="#a994ff"/>
    <text x="42" y="255" fill="#a994ff" font-size="13" font-weight="750" letter-spacing="2">SYSTEMS · INFERENCE</text>
    <text x="42" y="292" fill="#f4f7fb" font-size="25" font-weight="720">Faster tokens, less wait</text>
    <text x="42" y="321" fill="#9eabc0" font-size="16">decoding · KV cache · serving</text>
    <rect x="42" y="351" width="94" height="32" rx="16" fill="#25213f"/>
    <text x="64" y="372" fill="#b4a4ff" font-size="13" font-weight="700">TTFT ↓</text>
    <rect x="146" y="351" width="126" height="32" rx="16" fill="#162f2b"/>
    <text x="165" y="372" fill="#6ed0b2" font-size="13" font-weight="700">THROUGHPUT ↑</text>
    <path d="M391 373V267M391 373h85" stroke="#344157" stroke-width="1.5"/>
    <rect x="403" y="335" width="12" height="38" rx="4" fill="#3a345d"/>
    <rect x="424" y="313" width="12" height="60" rx="4" fill="#574c82"/>
    <rect x="445" y="286" width="12" height="87" rx="4" fill="#a994ff"/>
    <path d="M400 308c22-4 35-21 60-31" fill="none" stroke="#6ed7e8" stroke-width="2.5"/>


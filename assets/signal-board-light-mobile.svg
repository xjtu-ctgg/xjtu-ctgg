    <text x="42" y="321" fill="#607089" font-size="16">decoding · KV cache · serving</text>
    <rect x="42" y="351" width="94" height="32" rx="16" fill="#f0edff"/>
    <text x="64" y="372" fill="#5f47be" font-size="13" font-weight="700">TTFT ↓</text>
    <rect x="146" y="351" width="126" height="32" rx="16" fill="#edf7f4"/>

    <text x="192" y="164" fill="#8794a7" font-size="13" font-weight="650">TIP · AAAI · AAS</text>
    <rect x="410" y="53" width="58" height="48" rx="9" fill="#edf4f7" stroke="#b8ced5"/>
    <circle cx="435" cy="76" r="5" fill="#168295"/>
    <rect x="430" y="119" width="58" height="48" rx="9" fill="#f2f0fb" stroke="#cbc4e5"/>

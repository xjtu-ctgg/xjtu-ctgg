<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Weiyi Li — research and engineering signal board</title>
  <desc id="desc">Four visual cards summarize cross-view research, efficient LLM inference, agent systems, and competitive programming, followed by embodied navigation, reinforcement learning, and algorithm problem generation as future directions.</desc>
  <defs>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f7f8"/>
      <stop offset="0.52" stop-color="#f0edff"/>
      <stop offset="1" stop-color="#fff5e5"/>
    </linearGradient>
    <pattern id="microgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#607089" stroke-opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1000" height="560" rx="28" fill="#f8fafc"/>
  <rect width="1000" height="560" rx="28" fill="url(#microgrid)"/>

  <!-- Research -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="20" y="20" width="470" height="210" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
    <rect x="20" y="20" width="5" height="210" rx="3" fill="#168295"/>
    <text x="48" y="52" fill="#168295" font-size="12" font-weight="750" letter-spacing="2.2">RESEARCH · LUCL</text>
    <text x="48" y="91" fill="#152238" font-size="27" font-weight="730">Cross-view learning</text>
    <text x="48" y="119" fill="#607089" font-size="16">uncertainty · contrastive · multimodal</text>
    <rect x="48" y="151" width="132" height="32" rx="16" fill="#e7f5f6"/>
    <text x="66" y="172" fill="#126c7b" font-size="13" font-weight="700">3× FIRST AUTHOR</text>
    <text x="195" y="172" fill="#8794a7" font-size="13" font-weight="650">TIP · AAAI · AAS</text>

    <rect x="367" y="50" width="68" height="58" rx="10" fill="#edf4f7" stroke="#b8ced5"/>
    <path d="M376 65l16 12 13-10 20 15" fill="none" stroke="#4f7e8a" stroke-width="2"/>
    <circle cx="394" cy="81" r="5" fill="#168295"/>
    <rect x="393" y="124" width="68" height="58" rx="10" fill="#f2f0fb" stroke="#cbc4e5"/>
    <path d="M402 141h50M402 151h34M402 161h42" stroke="#7a68bd" stroke-width="2" stroke-linecap="round"/>
    <path d="M400 108C407 118 418 124 427 126" fill="none" stroke="#6d4fd3" stroke-width="2.5" stroke-dasharray="4 5"/>
  </g>

  <!-- Inference -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="510" y="20" width="470" height="210" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
    <rect x="510" y="20" width="5" height="210" rx="3" fill="#6d4fd3"/>
    <text x="538" y="52" fill="#6d4fd3" font-size="12" font-weight="750" letter-spacing="2.2">SYSTEMS · INFERENCE</text>
    <text x="538" y="91" fill="#152238" font-size="27" font-weight="730">Faster tokens, less wait</text>
    <text x="538" y="119" fill="#607089" font-size="16">decoding · KV cache · serving</text>
    <rect x="538" y="151" width="95" height="32" rx="16" fill="#f0edff"/>
    <text x="560" y="172" fill="#5f47be" font-size="13" font-weight="700">TTFT ↓</text>
    <rect x="641" y="151" width="124" height="32" rx="16" fill="#edf7f4"/>
    <text x="660" y="172" fill="#277660" font-size="13" font-weight="700">THROUGHPUT ↑</text>

    <path d="M830 177V65M830 177H950" stroke="#c9d1df" stroke-width="1.5"/>
    <rect x="846" y="129" width="14" height="48" rx="4" fill="#dcd5fb"/>
    <rect x="871" y="108" width="14" height="69" rx="4" fill="#c4b9f5"/>
    <rect x="896" y="82" width="14" height="95" rx="4" fill="#9f8de6"/>
    <rect x="921" y="56" width="14" height="121" rx="4" fill="#6d4fd3"/>
    <path d="M842 99C870 93 893 65 938 52" fill="none" stroke="#168295" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="938" cy="52" r="4.5" fill="#168295"/>
  </g>

  <!-- Agents -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="20" y="245" width="470" height="210" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
    <rect x="20" y="245" width="5" height="210" rx="3" fill="#3b6ea8"/>
    <text x="48" y="277" fill="#3b6ea8" font-size="12" font-weight="750" letter-spacing="2.2">AGENTS · LLM WIKI</text>
    <text x="48" y="316" fill="#152238" font-size="27" font-weight="730">Knowledge → action</text>
    <text x="48" y="344" fill="#607089" font-size="16">retrieval · tools · safety</text>
    <rect x="48" y="376" width="88" height="32" rx="16" fill="#edf3fa"/>
    <text x="68" y="397" fill="#346291" font-size="13" font-weight="700">HYBRID RAG</text>
    <text x="166" y="397" fill="#8794a7" font-size="13" font-weight="650">multi-format · structured calls</text>

    <rect x="348" y="285" width="44" height="54" rx="8" fill="#edf3fa" stroke="#b7c9dd"/>
    <path d="M358 300h24M358 309h18M358 318h21" stroke="#52789d" stroke-width="2" stroke-linecap="round"/>
    <rect x="348" y="360" width="44" height="54" rx="8" fill="#edf3fa" stroke="#b7c9dd"/>
    <path d="M358 375h24M358 384h18M358 393h21" stroke="#52789d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="430" cy="350" r="28" fill="#3b6ea8"/>
    <path d="M418 350l8 8 17-19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M393 312h25c8 0 12 8 12 16M393 387h25c8 0 12-8 12-16" fill="none" stroke="#8ea7c2" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Algorithms -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="510" y="245" width="470" height="210" rx="22" fill="#ffffff" stroke="#dbe3ec"/>
    <rect x="510" y="245" width="5" height="210" rx="3" fill="#b36c0c"/>
    <text x="538" y="277" fill="#a4620b" font-size="12" font-weight="750" letter-spacing="2.2">ALGORITHMIC CORE · ICPC / CCPC</text>
    <text x="538" y="316" fill="#152238" font-size="27" font-weight="730">Think fast. Prove it.</text>
    <text x="538" y="344" fill="#607089" font-size="16">modeling · correctness · performance</text>
    <rect x="538" y="376" width="96" height="32" rx="16" fill="#fff3dd"/>
    <text x="561" y="397" fill="#945908" font-size="13" font-weight="750">2× GOLD</text>
    <rect x="644" y="376" width="104" height="32" rx="16" fill="#f1f3f6"/>
    <text x="666" y="397" fill="#657185" font-size="13" font-weight="750">3× SILVER</text>

    <path d="M872 286h48v22c0 34-24 57-48 65-24-8-48-31-48-65v-22h48z" fill="#fff5e5" stroke="#d79a40" stroke-width="2"/>
    <path d="M851 286v-12h42v12M856 326l10 10 22-26" fill="none" stroke="#b36c0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="872" cy="392" r="18" fill="#b36c0c"/>
    <text x="866" y="399" fill="#fff" font-size="20" font-weight="800">1</text>
  </g>

  <!-- Next vector -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="20" y="475" width="960" height="65" rx="20" fill="url(#next)" stroke="#dbe3ec"/>
    <text x="48" y="502" fill="#657185" font-size="11" font-weight="750" letter-spacing="2">NEXT VECTOR</text>
    <text x="48" y="526" fill="#27364d" font-size="16" font-weight="670">Embodied navigation</text>
    <circle cx="273" cy="511" r="4" fill="#168295"/>
    <path d="M277 511H385" stroke="#9aa8ba" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="402" y="516" fill="#27364d" font-size="16" font-weight="670">Reinforcement learning</text>
    <circle cx="641" cy="511" r="4" fill="#6d4fd3"/>
    <path d="M645 511H739" stroke="#9aa8ba" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="756" y="516" fill="#27364d" font-size="16" font-weight="670">Problem generation</text>
  </g>
</svg>
